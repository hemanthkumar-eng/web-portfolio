<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b1e"/>
      <stop offset="100%" stop-color="#3b0f2e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#140912"/>
      <stop offset="100%" stop-color="#241226"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#be185d"/>
      <stop offset="100%" stop-color="#7f1d4d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#0a0407" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="48" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="160" y="120" width="880" height="560" rx="40" fill="#0a0407" opacity="0.8" stroke="#9f1239"/>
  </g>

  <!-- Discover phone -->
  <rect x="220" y="180" width="320" height="440" rx="36" fill="url(#screen)" stroke="#f43f5e" stroke-width="3"/>
  <!-- profile card -->
  <rect x="250" y="250" width="260" height="280" rx="24" fill="url(#card)"/>
  <circle cx="380" cy="350" r="52" fill="#fda4af" opacity="0.9"/>
  <rect x="280" y="430" width="140" height="16" rx="8" fill="#fff1f2" opacity="0.9"/>
  <rect x="280" y="456" width="200" height="12" rx="6" fill="#fff1f2" opacity="0.5"/>
  <rect x="280" y="478" width="90" height="24" rx="12" fill="#fb7185" opacity="0.7"/>
  <rect x="380" y="478" width="90" height="24" rx="12" fill="#fb7185" opacity="0.7"/>
  <!-- action buttons -->
  <circle cx="320" cy="570" r="24" fill="#1f1320" stroke="#64748b" stroke-width="2"/>
  <path d="M311 561 l18 18 M329 561 l-18 18" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="440" cy="570" r="24" fill="url(#heart)"/>
  <path d="M440 582 l-13 -12 a8 8 0 0 1 13 -10 a8 8 0 0 1 13 10 z" fill="#fff1f2"/>

  <!-- Chat phone -->
  <rect x="660" y="220" width="280" height="360" rx="40" fill="url(#screen)" stroke="#fb7185" stroke-width="3"/>
  <!-- match banner -->
  <rect x="690" y="256" width="220" height="70" rx="18" fill="url(#heart)" opacity="0.9"/>
  <circle cx="728" cy="291" r="18" fill="#fda4af"/>
  <circle cx="760" cy="291" r="18" fill="#fecdd3"/>
  <!-- chat bubbles -->
  <rect x="690" y="350" width="170" height="38" rx="14" fill="#2a1527" stroke="#4c1d3a"/>
  <rect x="740" y="400" width="170" height="38" rx="14" fill="#e11d48" opacity="0.85"/>
  <rect x="690" y="450" width="130" height="38" rx="14" fill="#2a1527" stroke="#4c1d3a"/>
  <rect x="780" y="500" width="130" height="38" rx="14" fill="#e11d48" opacity="0.6"/>
  <!-- typing indicator -->
  <circle cx="706" cy="556" r="5" fill="#fb7185"/>
  <circle cx="722" cy="556" r="5" fill="#fb7185" opacity="0.6"/>
  <circle cx="738" cy="556" r="5" fill="#fb7185" opacity="0.3"/>

  <text x="240" y="160" fill="#ffe4e6" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600">
    Amour — Dating app, live on Google Play
  </text>
  <text x="252" y="232" fill="#fff1f2" font-family="Arial, Helvetica, sans-serif" font-size="18" opacity="0.9">
    Discover
  </text>
  <text x="708" y="245" fill="#ffe4e6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" opacity="0.9">
    It&#39;s a match
  </text>
</svg>
