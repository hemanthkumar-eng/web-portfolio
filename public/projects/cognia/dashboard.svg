<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b2a4a"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#12233b"/>
    </linearGradient>
    <linearGradient id="mascot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#208AEF"/>
    </linearGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#208AEF"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1200" height="800" rx="48" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="160" y="120" width="880" height="560" rx="40" fill="#020617" opacity="0.8" stroke="#1e3a8a"/>
  </g>

  <!-- Conversation phone -->
  <rect x="220" y="180" width="320" height="440" rx="36" fill="url(#screen)" stroke="#208AEF" stroke-width="3"/>
  <!-- mascot -->
  <circle cx="380" cy="285" r="46" fill="url(#mascot)"/>
  <circle cx="366" cy="278" r="8" fill="#0b1220"/>
  <circle cx="394" cy="278" r="8" fill="#0b1220"/>
  <path d="M364 300 q16 16 32 0" stroke="#0b1220" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- speaking waves -->
  <circle cx="380" cy="285" r="62" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
  <circle cx="380" cy="285" r="78" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.25"/>
  <!-- caption bubbles -->
  <rect x="250" y="360" width="200" height="42" rx="14" fill="#208AEF" opacity="0.85"/>
  <rect x="300" y="414" width="190" height="36" rx="14" fill="#1e293b" stroke="#334155"/>
  <rect x="250" y="462" width="170" height="36" rx="14" fill="#208AEF" opacity="0.55"/>
  <!-- mic button -->
  <circle cx="380" cy="560" r="30" fill="url(#mic)"/>
  <rect x="371" y="544" width="18" height="26" rx="9" fill="#e0f2fe"/>
  <path d="M366 566 a14 14 0 0 0 28 0" stroke="#e0f2fe" stroke-width="3" fill="none"/>

  <!-- Progress phone -->
  <rect x="660" y="220" width="280" height="360" rx="40" fill="url(#screen)" stroke="#0ea5e9" stroke-width="3"/>
  <!-- streak card -->
  <rect x="690" y="256" width="220" height="90" rx="18" fill="#208AEF" opacity="0.85"/>
  <circle cx="726" cy="301" r="22" fill="#fbbf24" opacity="0.9"/>
  <!-- XP bar -->
  <rect x="690" y="372" width="220" height="18" rx="9" fill="#1e293b"/>
  <rect x="690" y="372" width="150" height="18" rx="9" fill="#38bdf8"/>
  <!-- lesson rows -->
  <rect x="690" y="410" width="220" height="46" rx="12" fill="#12233b" stroke="#334155"/>
  <rect x="690" y="466" width="220" height="46" rx="12" fill="#12233b" stroke="#334155"/>
  <rect x="690" y="522" width="220" height="46" rx="12" fill="#12233b" stroke="#334155"/>
  <circle cx="716" cy="433" r="10" fill="#34d399"/>
  <circle cx="716" cy="489" r="10" fill="#34d399"/>
  <circle cx="716" cy="545" r="10" fill="#475569"/>

  <text x="240" y="160" fill="#e0f2fe" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600">
    Cognia — Speak English with a voice tutor
  </text>
  <text x="252" y="252" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="18" opacity="0.9">
    Voice buddy
  </text>
  <text x="708" y="245" fill="#e0f2fe" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" opacity="0.9">
    Streak &amp; XP
  </text>
</svg>
